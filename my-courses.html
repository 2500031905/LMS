<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses</title>

    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222b45;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Brand */
        .brand {
            color: #5b4bdb;
            font-weight: 800;
            font-size: 24px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            background: #5b4bdb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn.light {
            background: #eeecff;
            color: #5142ce;
        }

        /* Text */
        .muted {
            color: #737b91;
            line-height: 1.6;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .side {
            width: 245px;
            background: #fff;
            padding: 25px 18px;
            box-shadow: 2px 0 15px #1725540a;
        }

        .side .brand {
            display: block;
            margin: 0 10px 28px;
        }

        /* Navigation */
        .nav a {
            display: block;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: 9px;
            color: #59617a;
        }

        .nav a:hover,
        .nav a.active {
            background: #eeecff;
            color: #5142ce;
            font-weight: 700;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        /* Cards */
        .card {
            background: #fff;
            border: 1px solid #eceef5;
            border-radius: 15px;
            padding: 22px;
        }

        /* Course Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
        }

        /* Dashboard Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        /* Large Text */
        .big {
            font-size: 30px;
            color: #5b4bdb;
            font-weight: 800;
        }

        /* Form Elements */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe2ed;
            border-radius: 9px;
            font: inherit;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 14px 0 7px;
        }

        /* Messages */
        .msg {
            margin-top: 12px;
        }

        .danger {
            background: #c0392b;
        }

        .secondary {
            background: #eeecff;
            color: #5142ce;
        }

        /* Progress Bar */
        .bar {
            height: 9px;
            background: #e8e9f2;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            background: #5b4bdb;
        }

        /* Responsive Design */
        @media (max-width: 800px) {

            .layout {
                display: block;
            }

            .side {
                width: 100%;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
            }

            .nav a {
                padding: 9px;
            }

            .main {
                padding: 18px;
            }

            .grid,
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="side">

            <a class="brand" href="dashboard.html">
                EduLearn
            </a>

            <nav class="nav">

                <a href="dashboard.html">
                    Overview
                </a>

                <a href="courses.html">
                    Explore Courses
                </a>

                <a href="my-courses.html">
                    My Courses
                </a>

                <a href="profile.html">
                    My Profile
                </a>

                <a href="#" onclick="logout()">
                    Logout
                </a>

            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main">

            <h1>
                My Courses
            </h1>

            <p class="muted">
                Your enrolled courses and learning progress.
            </p>

            <!-- Course List -->
            <div class="grid" id="list"></div>

        </main>

    </div>

    <script>
        // Get current logged-in user
        let current = JSON.parse(
            localStorage.getItem("eduLearnCurrentUser") || "null"
        );

        // Authentication check
        if (!current) {
            location.href = "login.html";
        } else if (current.role !== "student") {
            location.href = "admin-dashboard.html";
        }

        // Logout function
        function logout() {
            localStorage.removeItem("eduLearnCurrentUser");
            location.href = "login.html";
        }

        // Get all courses
        let all = JSON.parse(
            localStorage.getItem("eduLearnCourses") || "[]"
        );

        // Get enrolled course IDs
        let enrolled = JSON.parse(
            localStorage.getItem(
                "eduLearnEnrollments_" + current.id
            ) || "[]"
        );

        // Progress LocalStorage key
        let progressKey =
            "eduLearnProgress_" + current.id;

        // Get saved progress
        let progress = JSON.parse(
            localStorage.getItem(progressKey) || "{}"
        );

        // Course list container
        let list = document.getElementById("list");

        // Display enrolled courses
        all
            .filter(function (course) {
                return enrolled.includes(course.id);
            })
            .forEach(function (course) {

                let value = Number(progress[course.id]) || 0;

                // Create course card
                let card = document.createElement("article");

                card.className = "card";

                card.innerHTML = `
                    <h2></h2>

                    <p class="muted"></p>

                    <div class="bar">
                        <div class="fill"></div>
                    </div>

                    <p class="pct"></p>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        step="10"
                    >

                    <button
                        class="btn"
                        style="margin-top:12px;"
                    >
                        Save Progress
                    </button>
                `;

                // Course title
                card.querySelector("h2").textContent =
                    course.title;

                // Course description
                card.querySelector("p").textContent =
                    course.description;

                // Set progress bar width
                card.querySelector(".fill").style.width =
                    value + "%";

                // Set progress text
                card.querySelector(".pct").textContent =
                    value + "% completed";

                // Progress slider
                let range = card.querySelector("input");

                range.value = value;

                // Save Progress button
                card
                    .querySelector("button")
                    .onclick = function () {

                        progress[course.id] =
                            Number(range.value);

                        // Save progress to LocalStorage
                        localStorage.setItem(
                            progressKey,
                            JSON.stringify(progress)
                        );

                        // Update progress bar
                        card.querySelector(".fill").style.width =
                            range.value + "%";

                        // Update percentage
                        card.querySelector(".pct").textContent =
                            range.value + "% completed";
                    };

                // Add card to page
                list.appendChild(card);
            });

        // Display message when no courses are enrolled
        if (!list.children.length) {

            list.innerHTML = `
                <article class="card">

                    <h2>
                        No enrolled courses
                    </h2>

                    <p class="muted">
                        Explore courses and enroll in one.
                    </p>

                    <a
                        class="btn"
                        href="courses.html"
                    >
                        Explore Courses
                    </a>

                </article>
            `;
        }
    </script>

</body>

</html>
