<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Courses</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222b45;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .brand {
            color: #5b4bdb;
            font-weight: 800;
            font-size: 24px;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            background: #5b4bdb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn.light {
            background: #eeecff;
            color: #5142ce;
        }

        .muted {
            color: #737b91;
            line-height: 1.6;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .side {
            width: 245px;
            background: #fff;
            padding: 25px 18px;
            box-shadow: 2px 0 15px #1725540a;
        }

        .side .brand {
            display: block;
            margin: 0 10px 28px;
        }

        .nav a {
            display: block;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: 9px;
            color: #59617a;
        }

        .nav a:hover,
        .nav a.active {
            background: #eeecff;
            color: #5142ce;
            font-weight: 700;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        /* Cards */
        .card {
            background: #fff;
            border: 1px solid #eceef5;
            border-radius: 15px;
            padding: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .big {
            font-size: 30px;
            color: #5b4bdb;
            font-weight: 800;
        }

        /* Form Elements */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe2ed;
            border-radius: 9px;
            font: inherit;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 14px 0 7px;
        }

        .msg {
            margin-top: 12px;
        }

        .danger {
            background: #c0392b;
        }

        .secondary {
            background: #eeecff;
            color: #5142ce;
        }

        /* Responsive Design */
        @media (max-width: 800px) {

            .layout {
                display: block;
            }

            .side {
                width: 100%;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
            }

            .nav a {
                padding: 9px;
            }

            .main {
                padding: 18px;
            }

            .grid,
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="side">

            <a
                class="brand"
                href="dashboard.html"
            >
                EduLearn
            </a>


            <nav class="nav">

                <a href="dashboard.html">
                    Overview
                </a>

                <a
                    href="courses.html"
                    class="active"
                >
                    Explore Courses
                </a>

                <a href="my-courses.html">
                    My Courses
                </a>

                <a href="profile.html">
                    My Profile
                </a>

                <a
                    href="#"
                    onclick="logout()"
                >
                    Logout
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <h1>
                Explore Courses
            </h1>

            <p class="muted">
                Browse and enroll in available courses.
            </p>


            <!-- Search -->
            <input
                type="text"
                id="search"
                placeholder="Search courses..."
                oninput="render()"
            >


            <!-- Course List -->
            <div
                class="grid"
                style="margin-top: 20px;"
                id="list"
            ></div>

        </main>

    </div>


    <script>

        // Get current logged-in user
        let current = JSON.parse(
            localStorage.getItem("eduLearnCurrentUser") || "null"
        );


        // Check student login
        if (!current) {

            location.href = "login.html";

        } else if (current.role !== "student") {

            location.href = "admin-dashboard.html";

        }


        // Logout
        function logout() {

            localStorage.removeItem(
                "eduLearnCurrentUser"
            );

            location.href = "login.html";
        }


        // Get all courses
        function getCourses() {

            return JSON.parse(
                localStorage.getItem("eduLearnCourses") || "[]"
            );
        }


        // Get courses enrolled by current student
        function getEnrolled() {

            return JSON.parse(
                localStorage.getItem(
                    "eduLearnEnrollments_" + current.id
                ) || "[]"
            );
        }


        // Enroll in a course
        function enroll(id) {

            let enrolledCourses =
                getEnrolled();


            // Check whether already enrolled
            if (!enrolledCourses.includes(id)) {

                enrolledCourses.push(id);


                // Save enrollment
                localStorage.setItem(
                    "eduLearnEnrollments_" + current.id,
                    JSON.stringify(enrolledCourses)
                );


                alert(
                    "Course enrolled successfully."
                );


                // Refresh course list
                render();
            }
        }


        // Display courses
        function render() {

            let searchText =
                document.getElementById("search")
                    .value
                    .toLowerCase();


            let list =
                document.getElementById("list");


            // Clear previous cards
            list.innerHTML = "";


            // Filter courses based on search
            let courses = getCourses().filter(
                function (course) {

                    let courseText =
                        course.title +
                        " " +
                        course.category +
                        " " +
                        course.description;


                    return courseText
                        .toLowerCase()
                        .includes(searchText);

                }
            );


            // Display each course
            courses.forEach(function (course) {

                // Check enrollment
                let isEnrolled =
                    getEnrolled().includes(course.id);


                // Create course card
                let card =
                    document.createElement("article");


                card.className =
                    "card";


                // Category
                let category =
                    document.createElement("span");

                category.className =
                    "btn light";


                category.style.fontSize =
                    "12px";

                category.style.padding =
                    "6px 9px";


                category.textContent =
                    course.category;


                // Course title
                let title =
                    document.createElement("h2");


                title.textContent =
                    course.title;


                // Description
                let description =
                    document.createElement("p");


                description.className =
                    "muted";


                description.textContent =
                    course.description;


                // Details link
                let details =
                    document.createElement("a");


                details.className =
                    "btn";


                details.style.marginRight =
                    "6px";


                details.textContent =
                    "Details";


                details.href =
                    "course-details.html?id=" +
                    course.id;


                // Enroll button
                let enrollButton =
                    document.createElement("button");


                enrollButton.className =
                    "btn";


                if (isEnrolled) {

                    enrollButton.textContent =
                        "Enrolled";

                    enrollButton.disabled =
                        true;

                } else {

                    enrollButton.textContent =
                        "Enroll";


                    enrollButton.onclick =
                        function () {

                            enroll(course.id);

                        };

                }


                // Add elements to card
                card.append(
                    category,
                    title,
                    description,
                    details,
                    enrollButton
                );


                // Add card to page
                list.appendChild(card);

            });

        }


        // Load courses when page opens
        render();

    </script>

</body>

</html>
